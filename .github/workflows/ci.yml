name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify lightweight package
        run: |
          npm pack --json > pack-report.json
          node -e '
            const report = require("./pack-report.json")[0]
            if (report.size > 2 * 1024 * 1024) {
              throw new Error(`packed artifact is too large: ${report.size} bytes`)
            }
            if (report.files.some(file => /electron|chromium/i.test(file.path))) {
              throw new Error("packed artifact contains an Electron/Chromium file")
            }
          '
          rm pack-report.json agent-trajectory-*.tgz

      - name: Audit bundled dependency graph
        run: npm audit --audit-level=high
