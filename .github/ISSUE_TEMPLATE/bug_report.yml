name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not attach real agent sessions,
        credentials, private prompts, proprietary source code, local usernames,
        home-directory paths, or unredacted exports. Use a minimal synthetic or
        redacted example. Report security issues through the private process in
        SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Affected source
      options:
        - DeepSeek Harness
        - Codex
        - ZCode
        - UI or shared server
        - Packaging
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and synthetic or redacted input.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Node.js version, and launch mode.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private content, personal information, and local paths.
          required: true
