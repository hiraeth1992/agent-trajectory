name: Feature request
description: Propose an improvement to the read-only trajectory viewer
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and the persisted source facts that support the
        proposal. Do not include private sessions, prompts, source code, or
        credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Available source evidence
      description: Which persisted, read-only facts can support this behavior?
  - type: checkboxes
    id: boundary
    attributes:
      label: Project boundary
      options:
        - label: The proposal preserves read-only source access and loopback-only serving.
          required: true
